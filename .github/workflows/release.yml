name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish to npm
    if: github.repository == 'hot-dev/hot-js'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          VERSION=$(node -p "require('./packages/sdk/package.json').version")
          TAG_NAME="v${VERSION}"

          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" != "$TAG_NAME" ]]; then
            echo "::error::Tag ${REF_NAME} does not match @hot-dev/sdk package version (${TAG_NAME})"
            exit 1
          fi

          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::Release workflow must run from a version tag (${TAG_NAME})"
            exit 1
          fi

          SRC_VERSION=$(node -e '
            const fs = require("node:fs");
            const match = fs.readFileSync("./packages/sdk/src/version.ts", "utf8").match(/VERSION\s*=\s*"([^"]+)"/);
            if (!match) process.exit(1);
            process.stdout.write(match[1]);
          ')

          if [[ "$SRC_VERSION" != "$VERSION" ]]; then
            echo "::error::packages/sdk/src/version.ts (${SRC_VERSION}) does not match packages/sdk/package.json (${VERSION})"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish @hot-dev/sdk
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --provenance --no-git-checks
