name: hot-js

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly: run the org API isolation job against hot main to catch API drift.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Test, and Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  test-node:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The published package supports Node 20+.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate

      # The build toolchain (tsup 9) needs Node 22+, so skip install scripts
      # and run the tests from source.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test
        run: pnpm test

  integration:
    name: Integration (hot dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install hot
        uses: hot-dev/setup-hot@92cf9e03f49293fb31f28a56ed2c85a3424d90ad # v1

      - name: Run integration tests
        run: ./integration/run.sh

  postgres-isolation:
    name: Org API isolation (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_NET_RETRY: "2"
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v7

      # A released CLI may lag these API changes. Pin the tested server source
      # separately so its schema, runtime qualification, and OpenAPI agree.
      # The weekly scheduled run builds hot main instead, to catch drift.
      - name: Checkout matching Hot server
        uses: actions/checkout@v7
        with:
          repository: hot-dev/hot
          ref: ${{ github.event_name == 'schedule' && 'main' || 'd5dde712f447daf88c38e5546f805496c46a2877' }} # Keep aligned with integration/hot-server.ref
          path: .hot-server
          persist-credentials: false

      - name: Verify matching Hot revision
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          expected="$(cat integration/hot-server.ref)"
          actual="$(git -C .hot-server rev-parse HEAD)"
          if [[ "$expected" != "$actual" ]]; then
            echo "Hot checkout and integration/hot-server.ref must match" >&2
            exit 1
          fi

      - name: Set up Python for the fixture
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build and PostgreSQL client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev cmake clang lld postgresql-client
          docker version

      - name: Install server Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"

      - name: Cache matching server build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: .hot-server -> target
          key: postgres-isolation-${{ github.event_name == 'schedule' && 'main' || hashFiles('integration/hot-server.ref') }}
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Tailwind for the server build
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hot-sdk-bin"
          curl -fsSL --retry 3 \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.0/tailwindcss-linux-x64 \
            -o "$RUNNER_TEMP/hot-sdk-bin/tailwindcss"
          chmod +x "$RUNNER_TEMP/hot-sdk-bin/tailwindcss"
          echo "$RUNNER_TEMP/hot-sdk-bin" >> "$GITHUB_PATH"

      - name: Build matching Hot CLI
        working-directory: .hot-server
        run: cargo build --locked --package hot_cli --jobs 4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          package-manager-cache: false

      - name: Install JavaScript dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          pnpm install --frozen-lockfile

      - name: Test PostgreSQL isolation with restricted runtime credentials
        run: |
          python3 integration/suborg_fixture.py \
            --backend postgres \
            --hot .hot-server/target/debug/hot \
            --hot-repo .hot-server \
            -- pnpm --filter @hot-dev/sdk exec vitest run test/suborg-integration.test.ts
